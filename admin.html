<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | PUJA Handmade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <header class="site-header admin-header">
      <div class="container nav-wrap">
        <div class="brand">
          <span class="brand-mark">P</span>
          <span>PUJA Handmade</span>
        </div>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="index.html#products">Products</a>
          <a href="#" id="logoutBtn" class="hidden">Logout</a>
        </nav>
      </div>
    </header>

    <main class="container admin-main">
      <section class="login-box" id="loginBox">
        <h2>Admin Login</h2>
        <form id="adminLoginForm">
          <label for="adminPassword">Password</label>
          <input
            type="password"
            id="adminPassword"
            name="adminPassword"
            placeholder="Enter admin password"
            required
          />
          <button type="submit" class="btn btn-primary full-width">Login</button>
        </form>
      </section>

      <section id="adminPanel" class="hidden admin-panel">
        <div class="admin-topbar">
          <h2>Manage products</h2>
          <button id="logoutBtnSecondary" class="btn btn-secondary">Logout</button>
        </div>

        <form id="productForm" class="product-form">
          <div class="form-grid">
            <div>
              <label for="productName">Product name</label>
              <input type="text" id="productName" required />
            </div>
            <div>
              <label for="productCategory">Category</label>
              <input type="text" id="productCategory" placeholder="e.g. Home decor" required />
            </div>
            <div>
              <label for="productPrice">Price</label>
              <input type="number" id="productPrice" min="0" step="0.01" required />
            </div>
            <div class="full-width">
              <label for="productDescription">Description</label>
              <textarea id="productDescription" rows="4" required></textarea>
            </div>
            <div class="full-width">
              <label for="productImage">Product image</label>
              <input type="file" id="productImage" accept="image/*" />
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add product</button>
        </form>

        <div class="admin-list-wrap">
          <h3>Current products</h3>
          <div id="adminProductsList" class="admin-products-list"></div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
